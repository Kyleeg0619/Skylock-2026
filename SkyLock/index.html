<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SkyLock</title>
        <link rel="stylesheet" href="https://use.typekit.net/eod1kak.css">
        <!-- bootstrap icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <p>Phaser Demo</p>
        </header>
        <main>
            <div id="game-container">
                <!-- Login Form -->
                <form id="loginForm">
                <label for="login-email">Email:</label>
                <input type="text" id="login-email" name="email" required>

                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>

                <button type="submit">Login</button>

                <p>Don't have an account? <a href="" class="formLink">Register</a></p>
            </form>

            <!-- Sign-Up Form -->
            <form id="signupForm">
            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" name="email" required>

            <label for="signup-username">Username:</label>
            <input type="text" id="signup-username" name="username" required>

            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" name="password" required>

            <label for="signup-confirmPassword">Confirm Password:</label>
            <input type="password" id="signup-confirmPassword" name="confirmPassword" required>

            <button type="submit">Sign Up</button>

            <p>Have an account? <a href="" class="formLink">Login</a></p>
        </form>

                <canvas id="gameCanvas"></canvas>
            </div>
        </main>
        <footer>
            <p>Created with Phaser 3</p>
        </footer>
        <script type="module" src="/src/main.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    </html>
